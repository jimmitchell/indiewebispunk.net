# /etc/nginx/sites-available/indiewebispunk.net
#
# STEP 1 ONLY: plain HTTP, just enough for certbot to answer the ACME
# challenge. Certbot rewrites this file in step 4 to add TLS and the
# http->https redirect. Do not hand-write the 443 block yet.

server {
    listen 80;
    listen [::]:80;

    server_name indiewebispunk.net www.indiewebispunk.net;
    root /var/www/indiewebispunk.net;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
