# /etc/nginx/sites-available/indiewebispunk.net
#
# Complete drop-in replacement — copy over whatever certbot generated.
# The ssl_certificate paths below are the ones certbot already created, so
# nothing about renewal changes.
#
# Before copying, confirm these two exist (certbot writes them):
#   ls -l /etc/letsencrypt/options-ssl-nginx.conf /etc/letsencrypt/ssl-dhparams.pem
# If ssl-dhparams.pem is missing, delete the ssl_dhparam line.

# ---- port 80: straight to the canonical https apex, one hop -------------
server {
    listen 80;
    listen [::]:80;
    server_name indiewebispunk.net www.indiewebispunk.net;

    return 301 https://indiewebispunk.net$request_uri;
}

# ---- www -> apex --------------------------------------------------------
server {
    # No `http2 on;` — that directive needs nginx >= 1.25.1 and this box runs
    # 1.24.0, where it fails to parse. No `http2` listen parameter either:
    # HTTP/2 is negotiated per socket, and the jimmitchell.org block already
    # enables it on :443, which is why this site answered HTTP/2 before any of
    # this config existed. Repeating it here only earns a "protocol options
    # redefined" warning.
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.indiewebispunk.net;

    ssl_certificate     /etc/letsencrypt/live/indiewebispunk.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiewebispunk.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://indiewebispunk.net$request_uri;
}

# ---- the site -----------------------------------------------------------
server {
    # No `http2 on;` — that directive needs nginx >= 1.25.1 and this box runs
    # 1.24.0, where it fails to parse. No `http2` listen parameter either:
    # HTTP/2 is negotiated per socket, and the jimmitchell.org block already
    # enables it on :443, which is why this site answered HTTP/2 before any of
    # this config existed. Repeating it here only earns a "protocol options
    # redefined" warning.
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name indiewebispunk.net;
    root /var/www/indiewebispunk.net;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/indiewebispunk.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiewebispunk.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/indiewebispunk-security.conf;

    # woff2 and png are already compressed; gzipping them wastes CPU.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css text/markdown application/javascript
                    application/json image/svg+xml application/manifest+json;

    # ---- repo metadata and deploy config must never be served ------------
    # The web root IS the git checkout, same shape as /var/www/cms. These
    # come first because nginx takes the first matching regex.

    # Dotfiles — .git/, .gitignore, .DS_Store — EXCEPT /.well-known/, which
    # must stay reachable for ACME HTTP-01 challenges at renewal time.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ^~ /deploy/ {           # these nginx configs
        deny all;
    }

    location = /IndieWeb.png {       # unused source art; the page uses
        deny all;                    # indieweb-is-punk.png
    }

    location = /README.md {          # repo docs, not site content
        deny all;
    }

    location = /LICENSE {
        deny all;
    }

    # NOTE: deliberately NOT denying [^/]+\.md the way jimmitchell.org does.
    # indieweb-is-punk-manifesto.md is a published part of this site — it is
    # linked from <head> as rel="alternate" and from the "Get the Markdown"
    # button. Copying that rule across would 403 both.

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's stock mime.types has no entry for .webmanifest. Using
    # default_type in a location beats a types{} block, because types{}
    # REPLACES the whole map rather than adding to it.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Without this the "Get the Markdown" button downloads a file
    # instead of showing it.
    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
    }

    # Re-include the snippet: the add_header below would otherwise wipe
    # every inherited security header.
    location ~* \.(?:png|ico|woff2)$ {
        # No `expires` here: it emits its own Cache-Control, which would be
        # sent alongside the one below as a duplicate header.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/indiewebispunk-security.conf;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include snippets/indiewebispunk-security.conf;
    }
}
