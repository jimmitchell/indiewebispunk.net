# /etc/nginx/snippets/indiewebispunk-security.conf
#
# NOTE: nginx's add_header does NOT merge across levels. Any location block
# that declares its own add_header silently DROPS every header inherited
# from the server block. So this snippet gets `include`d again inside each
# location that sets a header of its own. Do not remove those includes.

add_header X-Content-Type-Options  "nosniff"                            always;
add_header X-Frame-Options         "SAMEORIGIN"                         always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

# The page carries one inline <style> and one inline <script>, hence
# 'unsafe-inline' on those two. Everything else is same-origin: fonts are
# self-hosted, images are local plus data: URIs for the grain SVG.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
